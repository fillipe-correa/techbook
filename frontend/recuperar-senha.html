<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechBook | Recuperar senha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/index.css">
</head>

<body data-page="recover">

  <header class="login-header">
    <a href="index.html">
      <img src="img/LOGO TECHBOOK.svg" alt="TechBook" class="login-logo">
    </a>
  </header>

  <main class="auth-shell recover-shell">

    <section class="auth-card recover-card">
      <h1>Recuperar senha</h1>

      <p class="recover-text">
        Informe o e-mail cadastrado para receber as instruções de redefinição de senha.
      </p>

      <form id="recoverForm">
        <div class="input-group">
          <input type="email" id="recoverEmail" required>
          <label for="recoverEmail">E-mail</label>
        </div>

        <button class="button primary" type="submit">Enviar link</button>

        <p class="feedback" id="recoverFeedback"></p>
      </form>

      <a href="login.html" class="back-login-link">Voltar para o login</a>
    </section>

  </main>

  <script src="js/app.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
